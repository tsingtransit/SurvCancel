<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 708 550">
  <rect width="708" height="550" fill="#ffffff"/>

  <!-- Left Tensor Panel -->
  <rect x="0" y="2" width="190" height="546" rx="9" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.8"/>
  <rect x="0" y="2" width="190" height="60" rx="9" fill="#0F2942"/>
  <rect x="0" y="48" width="190" height="14" fill="#0F2942"/>
  <text x="95" y="29" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">Clean58 Tensor</text>
  <text x="95" y="49" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="700" fill="#93C5FD">120 steps × 58 dims</text>

  <!-- Stacked Tensor Slices -->
  <rect x="46" y="82" width="118" height="408" rx="6" fill="#CBD5E1" stroke="#64748B" stroke-width="1.2"/>
  <rect x="40" y="90" width="118" height="408" rx="6" fill="#E2E8F0" stroke="#475569" stroke-width="1.2"/>
  <rect x="34" y="98" width="118" height="408" rx="6" fill="#FFFFFF" stroke="#0F2942" stroke-width="2"/>

  <!-- Observed prefix rows -->
  <rect x="42" y="116" width="39" height="29" rx="3.5" fill="#2563EB" opacity="0.65"/>
  <rect x="85" y="116" width="59" height="29" rx="3.5" fill="#0D9488" opacity="0.65"/>

  <rect x="42" y="155" width="39" height="29" rx="3.5" fill="#2563EB" opacity="0.78"/>
  <rect x="85" y="155" width="59" height="29" rx="3.5" fill="#0D9488" opacity="0.78"/>

  <rect x="42" y="194" width="39" height="29" rx="3.5" fill="#2563EB" opacity="0.90"/>
  <rect x="85" y="194" width="59" height="29" rx="3.5" fill="#0D9488" opacity="0.90"/>

  <rect x="42" y="233" width="39" height="29" rx="3.5" fill="#1D4ED8"/>
  <rect x="85" y="233" width="59" height="29" rx="3.5" fill="#0F766E"/>

  <!-- Landmark tau highlight -->
  <rect x="38" y="272" width="110" height="35" rx="4" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <rect x="42" y="277" width="39" height="25" rx="3.5" fill="#D97706"/>
  <rect x="85" y="277" width="59" height="25" rx="3.5" fill="#EA580C"/>

  <!-- Causal cutoff line -->
  <line x1="26" y1="319" x2="160" y2="319" stroke="#DC2626" stroke-width="2" stroke-dasharray="5,3"/>
  <rect x="158" y="277" width="24" height="25" rx="5" fill="#D97706"/>
  <text x="170" y="295" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">τ</text>

  <!-- Masked future rows -->
  <rect x="42" y="334" width="39" height="27" rx="3.5" fill="#E2E8F0"/>
  <rect x="85" y="334" width="59" height="27" rx="3.5" fill="#E2E8F0"/>
  <rect x="42" y="371" width="39" height="27" rx="3.5" fill="#E2E8F0"/>
  <rect x="85" y="371" width="59" height="27" rx="3.5" fill="#E2E8F0"/>
  <rect x="42" y="408" width="39" height="27" rx="3.5" fill="#E2E8F0"/>
  <rect x="85" y="408" width="59" height="27" rx="3.5" fill="#E2E8F0"/>
  <rect x="42" y="445" width="39" height="27" rx="3.5" fill="#E2E8F0"/>
  <rect x="85" y="445" width="59" height="27" rx="3.5" fill="#E2E8F0"/>

  <text x="19" y="212" text-anchor="middle" transform="rotate(-90 19 212)" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" font-weight="800" fill="#0F2942">Visible Prefix (≤ τ)</text>
  <text x="19" y="406" text-anchor="middle" transform="rotate(-90 19 406)" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13" font-weight="700" fill="#64748B">Causally Masked</text>

  <rect x="40" y="514" width="44" height="23" rx="5" fill="#DBEAFE"/>
  <text x="62" y="530" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" font-weight="800" fill="#1E3A8A">22d</text>
  <rect x="90" y="514" width="52" height="23" rx="5" fill="#CCFBF1"/>
  <text x="116" y="530" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="13.5" font-weight="800" fill="#115E59">36d</text>

  <!-- Arrow -->
  <line x1="195" y1="275" x2="213" y2="275" stroke="#0F2942" stroke-width="2.8"/>
  <polygon points="211,268 222,275 211,282" fill="#0F2942"/>

  <!-- Right Top Card: Focal Order & Lifecycle (22 dims) -->
  <rect x="225" y="2" width="483" height="265" rx="9" fill="#F8FAFC" stroke="#60A5FA" stroke-width="2"/>
  <rect x="225" y="2" width="483" height="50" rx="9" fill="#1D4ED8"/>
  <rect x="225" y="38" width="483" height="14" fill="#1D4ED8"/>
  <text x="241" y="33" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">Focal Order &amp; Lifecycle State</text>
  <rect x="624" y="14" width="70" height="26" rx="13" fill="#FFFFFF"/>
  <text x="659" y="32" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="800" fill="#1E3A8A">22 dims</text>

  <!-- 3 Focal rows -->
  <text x="241" y="99" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="800" fill="#0F172A">Order &amp; Trip</text>
  <text x="370" y="99" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="600" fill="#334155">O/D, trip dist, party, time</text>
  <rect x="546" y="82" width="118" height="22" rx="4.5" fill="#DBEAFE"/>
  <rect x="546" y="82" width="104" height="22" rx="4.5" fill="#1D4ED8"/>
  <text x="694" y="99" text-anchor="end" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" font-weight="800" fill="#1E3A8A">15</text>

  <line x1="239" y1="126" x2="694" y2="126" stroke="#E2E8F0" stroke-width="1.2"/>

  <text x="241" y="167" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="800" fill="#0F172A">Focal Lifecycle</text>
  <text x="370" y="167" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="600" fill="#334155">Wait, stage, match state</text>
  <rect x="546" y="150" width="118" height="22" rx="4.5" fill="#DBEAFE"/>
  <rect x="546" y="150" width="42" height="22" rx="4.5" fill="#1D4ED8"/>
  <text x="694" y="167" text-anchor="end" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" font-weight="800" fill="#1E3A8A">6</text>

  <line x1="239" y1="194" x2="694" y2="194" stroke="#E2E8F0" stroke-width="1.2"/>

  <text x="241" y="235" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="800" fill="#0F172A">Time Step</text>
  <text x="370" y="235" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="600" fill="#334155">Snapshot increment Δt</text>
  <rect x="546" y="218" width="118" height="22" rx="4.5" fill="#DBEAFE"/>
  <rect x="546" y="218" width="12" height="22" rx="4.5" fill="#1D4ED8"/>
  <text x="694" y="235" text-anchor="end" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" font-weight="800" fill="#1E3A8A">1</text>

  <!-- Right Bottom Card: Coupled Supply-Demand Context (36 dims) -->
  <rect x="225" y="281" width="483" height="267" rx="9" fill="#F8FAFC" stroke="#2DD4BF" stroke-width="2"/>
  <rect x="225" y="281" width="483" height="50" rx="9" fill="#0F766E"/>
  <rect x="225" y="317" width="483" height="14" fill="#0F766E"/>
  <text x="241" y="312" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="17" font-weight="800" fill="#FFFFFF">Coupled Supply–Demand Context</text>
  <rect x="624" y="293" width="70" height="26" rx="13" fill="#FFFFFF"/>
  <text x="659" y="311" text-anchor="middle" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="800" fill="#115E59">36 dims</text>

  <!-- 3 Context rows -->
  <text x="241" y="379" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="800" fill="#0F172A">Active Orders</text>
  <text x="370" y="379" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="600" fill="#334155">Nearby waits &amp; O/D dist</text>
  <rect x="546" y="362" width="118" height="22" rx="4.5" fill="#CCFBF1"/>
  <rect x="546" y="362" width="118" height="22" rx="4.5" fill="#0D9488"/>
  <text x="694" y="379" text-anchor="end" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" font-weight="800" fill="#115E59">17</text>

  <line x1="239" y1="406" x2="694" y2="406" stroke="#E2E8F0" stroke-width="1.2"/>

  <text x="241" y="447" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="800" fill="#0F172A">Available Fleet</text>
  <text x="370" y="447" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="600" fill="#334155">Seats &amp; top-3 vehicle dist</text>
  <rect x="546" y="430" width="118" height="22" rx="4.5" fill="#CCFBF1"/>
  <rect x="546" y="430" width="98" height="22" rx="4.5" fill="#0D9488"/>
  <text x="694" y="447" text-anchor="end" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" font-weight="800" fill="#115E59">14</text>

  <line x1="239" y1="474" x2="694" y2="474" stroke="#E2E8F0" stroke-width="1.2"/>

  <text x="241" y="515" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16" font-weight="800" fill="#0F172A">Supply Ratios</text>
  <text x="370" y="515" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="14" font-weight="600" fill="#334155">Feasible fleet per order</text>
  <rect x="546" y="498" width="118" height="22" rx="4.5" fill="#CCFBF1"/>
  <rect x="546" y="498" width="35" height="22" rx="4.5" fill="#0D9488"/>
  <text x="694" y="515" text-anchor="end" font-family="Arial, 'Helvetica Neue', Helvetica, sans-serif" font-size="16.5" font-weight="800" fill="#115E59">5</text>
</svg>
